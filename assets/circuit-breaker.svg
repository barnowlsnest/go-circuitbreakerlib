<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="title desc">
<title id="title">How go-circuitbreakerlib works</title>
<desc id="desc">Calls flow from your service through the breaker to a dependency. When the dependency fails, the breaker trips Open and rejects calls fast with ErrOpen. After the backoff it goes HalfOpen, lets a probe through, and closes again when the probe succeeds.</desc>
<style>
