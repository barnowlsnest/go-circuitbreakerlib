<text class="a c1" x="380" y="276" text-anchor="middle" font-size="14" opacity="0">Closed: calls pass through and every outcome is counted</text>
<text class="a c2" x="380" y="276" text-anchor="middle" font-size="14" opacity="0">The dependency fails; the failure rate climbs until a policy trips</text>
<text class="a c3" x="380" y="276" text-anchor="middle" font-size="14" opacity="0">Open: calls are rejected with ErrOpen without touching the network</text>
<text class="a c4" x="380" y="276" text-anchor="middle" font-size="14" opacity="0">Backoff elapsed: HalfOpen admits a probe call</text>
<text class="a c5" x="380" y="276" text-anchor="middle" font-size="14" opacity="0">The probe succeeds, so the breaker closes again</text>

<g font-size="11">
  <circle cx="40" cy="30" r="5" fill="var(--req)"/><text x="50" y="34" class="muted">request</text>
  <circle cx="115" cy="30" r="5" fill="var(--ok)"/><text x="125" y="34" class="muted">success</text>
  <circle cx="190" cy="30" r="5" fill="var(--bad)"/><text x="200" y="34" class="muted">failure / rejected</text>
  <circle cx="310" cy="30" r="5" fill="var(--probe)"/><text x="320" y="34" class="muted">probe</text>
</g>
</svg>
