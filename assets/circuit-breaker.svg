#lever { transform-box:view-box; transform-origin:350px 114px; animation-name:lever; }
#wireR { animation-name:wire; }
.wire { stroke:var(--edge); stroke-width:2; stroke-dasharray:4 5; }
.track { fill:var(--track); }
#meter { fill:var(--bad); transform-box:fill-box; transform-origin:left center; animation-name:meter; }
#backoff { fill:var(--probe); transform-box:fill-box; transform-origin:left center; animation-name:backoff; }
#meterLabel { animation-name:meterLabel; }
#backoffLabel { animation-name:backoffLabel; opacity:0; }
.ok { fill:var(--ok); } .bad { fill:var(--bad); } .probe { fill:var(--probe); }
@media (prefers-reduced-motion: reduce) { .a, .pk { animation-play-state:paused; } }
